name: build-bench-base-image

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/grit-usa/frappe-bench-base
  LMS_REPOSITORY: GRIT-USA/lms

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    env:
      lms_dispatch_token: ${{ secrets.LMS_REPO_DISPATCH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:deploy-latest

      - name: Validate LMS dispatch token
        if: ${{ env.lms_dispatch_token == '' }}
        run: |
          echo "Missing secret LMS_REPO_DISPATCH_TOKEN in GRIT-USA/bench." >&2
          echo "Create a PAT or fine-grained token with access to GRIT-USA/lms and set it as this repo secret." >&2
          exit 1

      - name: Trigger LMS image rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.LMS_REPO_DISPATCH_TOKEN }}
          repository: ${{ env.LMS_REPOSITORY }}
          event-type: bench-base-updated
          client-payload: |
            {"bench_sha":"${{ github.sha }}","bench_image":"${{ env.IMAGE_REPO }}:deploy-latest"}
